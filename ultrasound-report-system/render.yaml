# Render Blueprint: Render reads this file when you choose
# "New -> Blueprint" and pick this GitHub repository.

services:
  - type: web
    name: ultrasound-report-api
    runtime: python
    plan: free
    rootDir: ultrasound-report-system/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: BUNDLE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ORT_THREADS
        value: "1"

