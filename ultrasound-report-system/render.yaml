# Render Blueprint: Render reads this file when you choose
# "New -> Blueprint" and pick this GitHub repository.
services:
  - type: web
    name: ultrasound-report-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BUNDLE_URL          # direct link to web_bundle.zip (you fill this in)
        sync: false
      - key: ALLOWED_ORIGINS     # your Vercel address, e.g. https://ultrasound-report.vercel.app
        sync: false
      - key: ORT_THREADS
        value: "1"
